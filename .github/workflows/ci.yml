name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Lint backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Test backend
        run: cargo test --verbose

      - name: Build backend release
        run: cargo build --release --verbose

      - name: Lint Web UI crate
        run: cargo clippy --manifest-path webui/Cargo.toml --all-targets -- -D warnings

      - name: Test Web UI crate
        run: cargo test --manifest-path webui/Cargo.toml --verbose

  package-windows:
    name: Package Windows portable ZIP
    runs-on: windows-latest
    needs: build-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build portable ZIP
        run: python scripts/package_portable.py --include-desktop --desktop-required

      - name: Verify portable ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) {
            throw 'No portable ZIP was created in dist/.'
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = $archive.Entries | ForEach-Object { $_.FullName }
          } finally {
            $archive.Dispose()
          }

          $required = @(
            'speicherwald.exe',
            'ui/index.html',
            'RUN-SpeicherWald.cmd',
            'speicherwald-desktop.exe',
            'RUN-Desktop.cmd'
          )

          foreach ($entry in $required) {
            if ($entries -notcontains $entry) {
              throw "Portable ZIP is missing required entry: $entry"
            }
          }

          Write-Host "Portable ZIP verified: $($zip.FullName)"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: speicherwald-portable-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-main-build:
    name: Publish main build to Releases
    runs-on: ubuntu-latest
    needs: package-windows
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_TAG: main-build
      ASSET_NAME: speicherwald-portable-windows-x64.zip

    steps:
      - name: Download portable ZIP
        uses: actions/download-artifact@v7
        with:
          name: speicherwald-portable-windows-x64
          path: dist

      - name: Update rolling pre-release
        run: |
          set -euo pipefail

          zip="$(find dist -maxdepth 1 -name '*.zip' | head -n 1)"
          if [ -z "$zip" ]; then
            echo "No portable ZIP found in dist/." >&2
            exit 1
          fi

          # Stable file name so the download link never changes.
          mkdir -p upload
          cp "$zip" "upload/$ASSET_NAME"

          {
            echo "Automatic build of the current \`main\` branch. Replaced on every push."
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Built: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- Original file name: $(basename "$zip")"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > notes.md

          if gh release view "$BUILD_TAG" > /dev/null 2>&1; then
            # Move the tag to this commit, then swap the asset in place.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$BUILD_TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$BUILD_TAG" "upload/$ASSET_NAME" --clobber
            gh release edit "$BUILD_TAG" --notes-file notes.md --prerelease
          else
            gh release create "$BUILD_TAG" "upload/$ASSET_NAME" \
              --target "$GITHUB_SHA" \
              --title "Latest main build" \
              --notes-file notes.md \
              --prerelease \
              --latest=false
          fi

          echo "Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BUILD_TAG/$ASSET_NAME" >> "$GITHUB_STEP_SUMMARY"
